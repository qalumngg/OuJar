name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check Firebase config
        shell: bash
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "app/google-services.json is missing. See SETUP.md step 3." | tee "$RUNNER_TEMP/build.log"
            exit 1
          fi

      - name: Build release APK
        shell: bash
        run: gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Jarlings.apk"

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarlings build ${{ github.run_number }}
          files: ${{ runner.temp }}/Jarlings.apk

      - name: Save build log to ci-log branch
        if: always()
        shell: bash
        run: |
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/build-log-copy.txt" || echo "no log" > "$RUNNER_TEMP/build-log-copy.txt"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP/build-log-copy.txt" build.log
          git add build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin ci-log
